# Page: steering
# Edit this file. Run compile_settings_ui.py to emit settings_ui.json.
id: steering
label: Sterzo
icon: steering_wheel
order: 1
remote_configurable: true
description: Controllo laterale, cambi di corsia e comportamento dello sterzo
sections:
- id: mads
  title: Quando sterzare
  description: ''
  items:
  - key: Mads
    widget: toggle
    title: Sterza senza cruise
    description: Permette a zoompilot di sterzare anche con il cruise control spento. Se disattivo, sterzo e cruise si inseriscono e disinseriscono insieme.
    enablement:
    - $ref: '#/macros/offroad'
  sub_panels:
  - id: mads_settings
    label: Quando sterzare
    trigger_key: Mads
    trigger_condition:
      type: param
      key: Mads
      equals: true
    items:
    - key: MadsMainCruiseAllowed
      widget: toggle
      title: Sterza con cruise acceso
      description: Accendere il cruise con il suo tasto on/off attiva anche lo sterzo. Le auto senza tasto di mantenimento corsia devono averlo attivo per sterzare.
      enablement:
      - $ref: '#/macros/offroad'
      - $ref: '#/macros/mads_full_platforms'
    - key: MadsUnifiedEngagementMode
      widget: toggle
      title: Sterza con velocità cruise impostata
      description: Impostare o riprendere una velocità del cruise attiva anche lo sterzo, che resta attivo finché non lo spegni o spegni l'auto.
      enablement:
      - $ref: '#/macros/offroad'
      - $ref: '#/macros/mads_full_platforms'
    - key: MazdaTjaButton
      widget: toggle
      title: Tasto Mazda TJA
      description: Il tasto TJA sul volante diventa l'unico comando dello sterzo e il tasto MRCC controlla solo il cruise. Attivalo solo se la tua auto ha questo tasto.
      visibility:
      - type: capability
        field: brand
        equals: mazda
      enablement:
      - $ref: '#/macros/offroad'
    - key: MadsSteeringMode
      widget: multiple_button
      title: Sterzo in frenata
      description: Cosa fa lo sterzo quando premi il freno. Mantieni continua a sterzare. Pausa riprende quando rilasci il freno. Disinserisci spegne lo sterzo.
      options:
      - value: 0
        label: Mantieni
        enablement:
        - $ref: '#/macros/mads_full_platforms'
      - value: 1
        label: Pausa
        enablement:
        - $ref: '#/macros/mads_full_platforms'
      - value: 2
        label: Disinserisci
      enablement:
      - $ref: '#/macros/offroad'
- id: blinker
  title: Controllo con freccia
  description: Pausa del controllo laterale con la freccia inserita
  items:
  - key: BlinkerPauseLateralControl
    widget: toggle
    title: Pausa controllo laterale con freccia
    description: Mette in pausa il controllo laterale con la freccia inserita quando viaggi sotto la velocità selezionata.
    sub_items:
    - key: BlinkerMinLateralControlSpeed
      widget: option
      title: Velocità minima per la pausa del controllo laterale
      min: 0
      max: 255
      step: 5
      unit:
        metric: km/h
        imperial: mph
      enablement:
      - type: param
        key: BlinkerPauseLateralControl
        equals: true
    - key: BlinkerLateralReengageDelay
      widget: option
      title: Ritardo dopo la freccia
      description: Attesa prima che il controllo laterale riprenda dopo lo spegnimento della freccia.
      min: 0
      max: 10
      step: 1
      unit: second
      enablement:
      - type: param
        key: BlinkerPauseLateralControl
        equals: true
- id: torque
  title: Controllo di coppia
  description: Taratura della coppia di sterzo e metodo di controllo laterale
  enablement:
  - type: capability
    field: torque_allowed
    equals: true
  items:
  - key: EnforceTorqueControl
    widget: toggle
    title: Forza controllo laterale a coppia
    description: Attiva per obbligare sunnypilot a sterzare con il controllo laterale a coppia (Torque).
    visibility:
    - type: not
      condition:
        type: capability
        field: steer_control_type
        equals: angle
    enablement:
    - $ref: '#/macros/offroad'
    - type: capability
      field: torque_allowed
      equals: true
    - type: param
      key: NeuralNetworkLateralControl
      equals: false
  sub_panels:
  - id: torque_settings
    label: Impostazioni coppia
    trigger_key: EnforceTorqueControl
    trigger_condition:
      type: param
      key: EnforceTorqueControl
      equals: true
    items:
    - key: LateralJerkTorqueController
      widget: toggle
      title: Controller di coppia con jerk laterale
      description: Anticipa lo sterzo pianificato per ridurre le correzioni brusche, così il volante si muove in modo più fluido in curva. Funziona con Autotaratura e taratura personalizzata. Grazie a @twilsonco per l'implementazione.
      visibility:
      - type: not
        condition:
          type: capability
          field: steer_control_type
          equals: angle
      enablement:
      - $ref: '#/macros/offroad'
      - type: param
        key: NeuralNetworkLateralControl
        equals: false
    - key: LiveTorqueParamsToggle
      widget: toggle
      title: Autotaratura
      description: Attiva l'autotaratura del controllo laterale a coppia sulle piattaforme che non lo usano di default.
      enablement:
      - $ref: '#/macros/offroad'
    - key: LiveTorqueParamsRelaxedToggle
      widget: toggle
      title: Impostazioni meno restrittive per l'Autotaratura (Beta)
      description: "Impostazioni meno rigide per l'Autotaratura: torqued è più tollerante mentre apprende i valori."
      enablement:
      - $ref: '#/macros/offroad'
      - type: param
        key: LiveTorqueParamsToggle
        equals: true
    - key: CustomTorqueParams
      widget: toggle
      title: Attiva taratura personalizzata
      description: Attiva la taratura personalizzata del controllo laterale a coppia. Modificare Fattore di accelerazione laterale e Attrito qui sotto sostituisce i valori offline indicati nei file YAML in "opendbc/car/torque_data". I valori vengono usati anche in tempo reale quando è attiva l'opzione "Taratura manuale in tempo reale".
      enablement:
      - $ref: '#/macros/offroad'
    - key: TorqueParamsOverrideEnabled
      widget: toggle
      title: Taratura manuale in tempo reale
      description: Obbliga il controller laterale a coppia a usare i valori fissi invece di quelli appresi dall'Autotaratura. Attivandolo, i valori dell'Autotaratura vengono sostituiti.
      enablement:
      - $ref: '#/macros/offroad'
      - type: param
        key: CustomTorqueParams
        equals: true
    - key: TorqueParamsOverrideLatAccelFactor
      widget: option
      title: Fattore di accelerazione laterale
      title_param_suffix:
        param: TorqueParamsOverrideEnabled
        values:
          'true': (tempo reale e offline)
          'false': (solo offline)
      min: 0.1
      max: 5.0
      step: 0.1
      unit: m/s²
      enablement:
      - type: param
        key: CustomTorqueParams
        equals: true
      - type: any
        conditions:
        - type: param
          key: TorqueParamsOverrideEnabled
          equals: true
        - type: offroad_only
    - key: TorqueParamsOverrideFriction
      widget: option
      title: Attrito
      title_param_suffix:
        param: TorqueParamsOverrideEnabled
        values:
          'true': (tempo reale e offline)
          'false': (solo offline)
      min: 0.0
      max: 1.0
      step: 0.01
      enablement:
      - type: param
        key: CustomTorqueParams
        equals: true
      - type: any
        conditions:
        - type: param
          key: TorqueParamsOverrideEnabled
          equals: true
        - type: offroad_only
    - key: TorqueControlTune
      widget: multiple_button
      title: Versione taratura controllo di coppia (modelli piccoli)
      description: Scegli la versione della taratura del controllo di coppia da usare quando guida il modello piccolo.
      enablement:
      - $ref: '#/macros/offroad'
    - key: TorqueControlTuneBig
      widget: multiple_button
      title: Versione taratura controllo di coppia (modelli grandi)
      description: Scegli la versione della taratura del controllo di coppia da usare quando guida un modello grande.
      enablement:
      - $ref: '#/macros/offroad'
- id: lane_change
  title: Cambio corsia
  description: Tempi e comportamento del cambio corsia automatico
  items:
  - key: AutoLaneChangeTimer
    widget: option
    title: Cambio corsia automatico con freccia
    description: |-
      Imposta un ritardo per il cambio corsia automatico quando inserisci la freccia. Se imposti un ritardo, non serve dare un colpetto al volante per cambiare corsia. Predefinito: Colpetto.
    details: |-
      Usa questa funzione con prudenza. Inserisci la freccia solo quando traffico e condizioni della strada lo consentono.
    options:
    - value: -1
      label: 'Off'
    - value: 0
      label: Colpetto
    - value: 1
      label: Senza colpetto
    - value: 2
      label: 0,5 secondi
    - value: 3
      label: 1 secondo
    - value: 4
      label: 2 secondi
    - value: 5
      label: 3 secondi
  - key: RoadEdgeLaneChangeEnabled
    widget: multiple_button
    title: 'Blocca cambio corsia: rilevamento bordo strada'
    description: Blocca il cambio corsia quando il modello vede il bordo della strada dal lato della freccia. Silenzioso mostra l'avviso senza segnale acustico.
    options:
    - value: 0
      label: 'Off'
    - value: 1
      label: Sonoro
    - value: 2
      label: Silenzioso
  - key: LaneChangeSmoothing
    widget: option
    title: Fluidità cambio corsia
    description: Rallenta i cambi corsia automatici al ritmo scelto. Off è il comportamento di serie; ogni ritmo è più dolce. La correzione di fine manovra mantiene la sua efficacia a ogni ritmo, così l'auto si assesta nella nuova corsia senza scatti del volante.
    options:
    - value: 0
      label: 'Off'
    - value: 1
      label: Veloce
    - value: 2
      label: Medio
    - value: 3
      label: Lento
    - value: 4
      label: Molto lento
  - key: AutoLaneChangeBsmDelay
    widget: toggle
    title: 'Cambio corsia automatico: ritardo con angolo cieco'
    description: Attiva un ritardo per il cambio corsia quando il monitoraggio dell'angolo cieco (BSM) rileva un veicolo nell'angolo cieco.
    enablement:
    - type: capability
      field: has_bsm
      equals: true
    - type: param_compare
      key: AutoLaneChangeTimer
      op: '>'
      value: 0
  - key: AutoOvertake
    widget: toggle
    title: Sorpasso automatico
    description: |-
      Passa automaticamente nella corsia di sinistra quando è libera.
      Funziona anche senza inserire la freccia. Usare con prudenza.
    details: |-
      Questa funzione tenta un cambio corsia a sinistra dopo 2 secondi se la corsia di sinistra è libera,
      anche se davanti non c'è un veicolo più lento. Sii sempre pronto a riprendere il controllo.
  - key: NavLaneChange
    widget: toggle
    title: Cambio corsia da navigatore
    description: |-
      Con la navigazione attiva, cambia corsia da solo verso il lato di uscite e bivi in arrivo.
      Richiede Navigazione attiva e una destinazione impostata. Usare con prudenza.
    details: |-
      Quando il navigatore indica un'uscita o un bivio a sinistra o a destra entro circa 800 m,
      tenta un solo cambio corsia verso quel lato, senza freccia, poi attende almeno 15 secondi.
      Controlla solo l'angolo cieco dell'auto e la telecamera (corsia presente e libera, bordo strada):
      non vede i veicoli veloci che arrivano da dietro. Una freccia, il freno o lo sterzo in senso
      opposto annullano la manovra. Sii sempre pronto a riprendere il controllo.
