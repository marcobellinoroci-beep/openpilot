# Page: device
# Edit this file. Run compile_settings_ui.py to emit settings_ui.json.
id: device
label: Dispositivo
icon: device
order: 6
remote_configurable: true
description: Comportamento del dispositivo, unità di misura e registrazione
sections:
- id: general
  title: Generale
  description: Alimentazione, avvio e unità di misura
  items:
  - key: OffroadModeRequested
    widget: toggle
    title: Forza modalità offroad
  - key: DeviceBootMode
    widget: option
    title: Comportamento al risveglio
    description: 'Stabilisce lo stato del dispositivo dopo l''avvio o la sospensione. Predefinito: il dispositivo si avvia/riattiva normalmente ed è pronto all''inserimento. Offroad: dopo l''avvio/risveglio il dispositivo resta in modalità Sempre offroad.'
    options:
    - value: 0
      label: Standard
    - value: 1
      label: Sempre offroad
  - key: QuietMode
    widget: toggle
    title: Modalità silenziosa
  - key: OnroadUploads
    widget: toggle
    title: Caricamenti durante la guida
  - key: MaxTimeOffroad
    widget: option
    title: Tempo massimo offroad
    description: Il dispositivo si spegne automaticamente dopo il tempo impostato, una volta spento il motore. Il valore predefinito è 30h.
    options:
    - value: 0
      label: Sempre acceso
    - value: 5
      label: 5m
    - value: 10
      label: 10m
    - value: 15
      label: 15m
    - value: 30
      label: 30m
    - value: 60
      label: 1h
    - value: 120
      label: 2h
    - value: 180
      label: 3h
    - value: 300
      label: 5h
    - value: 600
      label: 10h
    - value: 1440
      label: 24h
    - value: 1800
      label: 30h (predefinito)
- id: language
  title: Lingua
  items:
  - key: LanguageSetting
    widget: info
    title: Lingua
