# Page: vehicle (per-brand settings)
# Compiles to settings_ui.json#vehicle_settings (brand = section id).
id: vehicle
label: Veicolo
icon: vehicle
order: 99
kind: vehicle
sections:
- id: hyundai
  title: Impostazioni Hyundai / Kia / Genesis
  description: ''
  items:
  - key: HyundaiLongitudinalTuning
    widget: multiple_button
    title: Taratura longitudinale personalizzata
    options:
    - value: 0
      label: 'Off'
    - value: 1
      label: Dinamica
    - value: 2
      label: Predittiva
    visibility:
    - type: capability
      field: hyundai_alpha_long_available
      equals: true
    enablement:
    - $ref: '#/macros/offroad'
    - $ref: '#/macros/longitudinal'
- id: subaru
  title: Impostazioni Subaru
  description: ''
  items:
  - key: SubaruStopAndGo
    widget: toggle
    title: Stop and Go (Beta)
    enablement:
    - $ref: '#/macros/offroad'
    - type: capability
      field: has_stop_and_go
      equals: true
  - key: SubaruStopAndGoManualParkingBrake
    widget: toggle
    title: Stop and Go con freno di stazionamento manuale (Beta)
    enablement:
    - $ref: '#/macros/offroad'
    - type: capability
      field: has_stop_and_go
      equals: true
- id: tesla
  title: Impostazioni Tesla
  description: ''
  items:
  - key: TeslaCoopSteering
    widget: toggle
    title: Sterzo cooperativo (Beta)
    enablement:
    - $ref: '#/macros/offroad'
  - key: TeslaMadsScreenButton
    widget: multiple_button
    title: Attivazione MADS dallo schermo
    description: 'Tocca lo schermo dell''infotainment con più dita per attivare o disattivare MADS. Se attivo, consente di usare tutte le funzioni MADS. Scegliere più dita può ridurre le attivazioni accidentali. Nota: impostandolo su Off le impostazioni MADS tornano ai valori predefiniti.'
    options:
    - value: 0
      label: 'Off'
    - value: 1
      label: 3 dita
    - value: 2
      label: 4 dita
    - value: 3
      label: 5 dita
    visibility:
    - type: capability
      field: tesla_has_vehicle_bus
      equals: true
    enablement:
    - $ref: '#/macros/offroad'
- id: toyota
  title: Impostazioni Toyota / Lexus
  description: ''
  items:
  - key: ToyotaEnforceStockLongitudinal
    widget: toggle
    needs_onroad_cycle: true
    title: Forza controllo longitudinale di serie
    description: 'sunnypilot non prenderà il controllo di acceleratore e freni: verrà usato il controllo longitudinale di serie Toyota.'
    enablement:
    - $ref: '#/macros/not_engaged'
  - key: ToyotaStopAndGoHack
    widget: toggle
    needs_onroad_cycle: true
    title: Hack Stop and Go (Alpha)
    description: 'sunnypilot permette ad alcune Toyota/Lexus di ripartire da sole nel traffico stop and go. Vale solo per alcuni modelli in grado di usare il controllo longitudinale. Funzione in fase alpha: usala a tuo rischio.'
    enablement:
    - $ref: '#/macros/not_engaged'
    - $ref: '#/macros/longitudinal'
    - type: param
      key: ToyotaEnforceStockLongitudinal
      equals: false
  - key: ToyotaTSS2Smooth
    widget: toggle
    needs_onroad_cycle: true
    title: Longitudinale fluido TSS2 (Alpha)
    description: Attiva un controllo longitudinale più fluido per i veicoli TSS2. Usa una curva di guadagno integrale personalizzata in base alla velocità per una guida più dolce nel traffico.
    enablement:
    - $ref: '#/macros/not_engaged'
    - $ref: '#/macros/longitudinal'
    - type: param
      key: ToyotaEnforceStockLongitudinal
      equals: false
    - type: capability
      field: toyota_tss2
      equals: true
