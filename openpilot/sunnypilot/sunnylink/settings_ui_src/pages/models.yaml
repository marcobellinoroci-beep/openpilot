# Page: models
# Edit this file. Run compile_settings_ui.py to emit settings_ui.json.
id: models
label: Modelli
icon: models
order: 10
remote_configurable: false
description: Comportamento del modello di guida e calibrazione della telecamera
sections:
- id: model_behavior
  title: Comportamento del modello
  description: Regolazione di intenzioni di corsia, centraggio in corsia e rilevamento del veicolo davanti
  items:
  - key: Blendful
    widget: toggle
    title: Assistenza centraggio corsia (Alpha)
    description: Aggiunge una leggera spinta verso il centro della corsia oltre allo sterzo del modello, più decisa quando le linee sono ben visibili. Cede in presenza di ostacoli.
  - key: FollowRightLine
    widget: toggle
    title: Segui solo la linea di destra (Alpha)
    description: "Mantiene l'auto a distanza fissa dal riferimento di destra e ignora la linea di sinistra: 1,8 m dalla linea di destra, oppure 1,45 m dal bordo strada se la linea manca (regolabile con l'offset sotto). Sposta al massimo 35 cm (compreso l'offset telecamera), solo tra 30 e 110 km/h, in rettilineo o curve dolci, senza frecce, cambi corsia o mani sul volante. Si annulla subito per 3 s se il modello sta aggirando qualcosa o c'è un veicolo vicino davanti. Non vede le auto in senso opposto né i ciclisti fuori traiettoria: resta responsabilità tua."
  - key: FollowRightMargin
    widget: option
    title: Offset distanza dal margine destro
    description: "Sposta la distanza tenuta da Segui solo la linea di destra: valori + allontanano l'auto dal margine destro, valori - la avvicinano. 0 = 1,8 m dalla linea (centro auto) o 1,45 m dal bordo strada. Dal bordo strada mai sotto 1,25 m. Lo spostamento totale resta al massimo 35 cm."
    min: -30
    max: 50
    step: 10
    unit: cm
    enablement:
    - type: param
      key: FollowRightLine
      equals: true
  - key: SmallModelSteering
    widget: option
    title: Sterzo con modello piccolo
    description: 'Con un modello grande, sotto questa velocità sterza il modello piccolo, più stabile a bassa velocità. 0 = disattivato. Predefinito: 5 m/s (11 mph, 18 km/h). Non disponibile con il modello predefinito.'
    min: 0
    max: 9
    step: 0.5
    unit: m/s
    enablement:
    - $ref: '#/macros/custom_model'
  - key: LaneTurnDesire
    widget: toggle
    title: Usa intenzioni di svolta
    description: Se viaggi a 32 km/h (20 mph) o meno con la freccia inserita, l'auto pianifica una svolta in quella direzione nel primo percorso percorribile. Evita situazioni (ad esempio ai semafori rossi) in cui l'auto potrebbe pianificare la svolta nella direzione sbagliata.
  - key: LaneTurnValue
    widget: option
    title: Velocità per le intenzioni di svolta
    description: Imposta la velocità massima per le intenzioni di svolta.
    min: 0
    max: 20
    step: 1
    unit:
      metric: km/h
      imperial: mph
    enablement:
    - type: param
      key: LaneTurnDesire
      equals: true
    - $ref: '#/macros/advanced_only'
  - key: LagdToggle
    widget: toggle
    title: Apprendimento in tempo reale del ritardo di sterzo
    description: Permette al dispositivo di imparare e adattarsi al tempo di risposta dello sterzo dell'auto
  - key: LagdToggleDelay
    widget: option
    title: Regola ritardo software
    description: Regola il ritardo software quando l'apprendimento in tempo reale del ritardo di sterzo è disattivato. Il valore predefinito è 0.2
    min: 0.05
    max: 0.5
    step: 0.01
    enablement:
    - type: not
      condition:
        type: param
        key: LagdToggle
        equals: true
    - $ref: '#/macros/advanced_only'
- id: lateral_control
  title: Controllo laterale
  description: Controllo laterale con rete neurale per i modelli supportati
  items:
  - key: NeuralNetworkLateralControl
    widget: toggle
    title: Controllo laterale con rete neurale (NNLC)
    description: Usa una rete neurale per il controllo laterale al posto del controller di coppia predefinito.
    visibility:
    - type: not
      condition:
        type: capability
        field: steer_control_type
        equals: angle
    enablement:
    - $ref: '#/macros/offroad'
    - type: capability
      field: torque_allowed
      equals: true
    - type: param
      key: EnforceTorqueControl
      equals: false
    - type: param
      key: LateralJerkTorqueController
      equals: false
- id: camera
  title: Telecamera
  description: Posizione e calibrazione della telecamera
  items:
  - key: CameraOffset
    widget: option
    title: Regola offset telecamera
    description: Sposta virtualmente la prospettiva della telecamera per spostare il centro del modello a sinistra (valori +) o a destra (valori -)
    min: -0.35
    max: 0.35
    step: 0.01
    unit: meters
    enablement:
    - $ref: '#/macros/advanced_only'
