# Page: developer
# Edit this file. Run compile_settings_ui.py to emit settings_ui.json.
id: developer
label: Sviluppatore
icon: developer
order: 9
remote_configurable: true
description: Strumenti di debug, accesso remoto e servizi avanzati
sections:
- id: connectivity
  title: Connettività
  description: Accesso remoto e interfacce di debug
  items:
  - key: AdbEnabled
    widget: toggle
    blocked: true
    title: Attiva ADB
    description: ADB (Android Debug Bridge) permette di collegarsi al dispositivo via USB o tramite rete. Maggiori informazioni su https://docs.comma.ai/how-to/connect-to-comma.
    enablement:
    - $ref: '#/macros/offroad'
  - key: SshEnabled
    widget: toggle
    blocked: true
    title: Attiva SSH
  - key: JoystickDebugMode
    widget: toggle
    title: Modalità debug joystick
    enablement:
    - $ref: '#/macros/offroad'
  - key: NavigationEnabled
    widget: toggle
    title: Navigazione (Alpha)
    description: Navigazione svolta per svolta con mappa del percorso. Imposta la destinazione da comma connect.
    visibility:
    - $ref: '#/macros/release_branches_hide'
  - key: ShowDebugInfo
    widget: toggle
    title: Modalità debug interfaccia
- id: test_maneuvers
  title: Manovre di test
  description: 'PERICOLO: attivare queste manovre sostituisce la guida normale con sequenze di test deterministiche. Ogni modifica richiede una conferma esplicita. Usare solo in area chiusa al traffico.'
  visibility:
  - type: any
    conditions:
    - type: capability
      field: is_development
      equals: true
    - type: capability
      field: is_sp_release
      equals: true
  enablement:
  - type: any
    conditions:
    - type: capability
      field: is_development
      equals: true
    - type: param
      key: ShowAdvancedControls
      equals: true
  attestation_required: true
  items:
  - key: LateralManeuverMode
    widget: toggle
    title: '[TEST] Modalità manovra laterale'
    description: Sostituisce il normale controllo laterale con una sequenza di test deterministica. NON usare su strada.
    enablement:
    - $ref: '#/macros/not_engaged'
    - type: capability
      field: torque_allowed
      equals: true
  - key: LongitudinalManeuverMode
    widget: toggle
    title: '[TEST] Modalità manovra longitudinale'
    description: Sostituisce il normale controllo longitudinale con una sequenza di test deterministica. NON usare su strada.
    enablement:
    - $ref: '#/macros/not_engaged'
    - $ref: '#/macros/longitudinal'
- id: advanced_services
  title: Impostazioni avanzate
  description: ''
  items:
  - key: ShowAdvancedControls
    widget: toggle
    title: Mostra controlli avanzati
    description: Mostra o nasconde i controlli avanzati di sunnypilot. Cambia solo la visibilità delle opzioni, non il loro stato attivo/disattivo.
  - key: EnableGithubRunner
    widget: toggle
    title: Servizio GitHub Runner
    description: Attiva o disattiva il servizio GitHub runner.
    visibility:
    - $ref: '#/macros/release_branches_hide'
    enablement:
    - $ref: '#/macros/advanced_only'
  - key: EnableCopyparty
    widget: toggle
    title: Servizio copyparty
    description: 'copyparty è un file server molto completo: puoi usarlo per scaricare i tuoi percorsi, vedere i log e persino modificare alcuni file dal browser. Richiede di collegarti al comma in rete locale tramite il suo indirizzo IP.'
    enablement:
    - $ref: '#/macros/advanced_only'
  - key: QuickBootToggle
    widget: toggle
    title: Avvio rapido
    visibility:
    - type: not
      condition:
        type: any
        conditions:
        - type: capability
          field: is_sp_release
          equals: true
        - type: capability
          field: is_development
          equals: true
    enablement:
    - type: param
      key: DisableUpdates
      equals: true
    - $ref: '#/macros/advanced_only'
