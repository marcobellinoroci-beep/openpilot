# Page: display
# Edit this file. Run compile_settings_ui.py to emit settings_ui.json.
id: display
label: Schermo
icon: display
order: 3
remote_configurable: true
description: Luminosità, spegnimento e interattività dello schermo
sections:
- id: brightness_timeout
  title: Luminosità e spegnimento
  description: Attenuazione e spegnimento dello schermo durante la guida
  items:
  - key: OnroadScreenOffBrightness
    widget: multiple_button
    title: Luminosità durante la guida
    options:
    - value: 0
      label: Auto (predefinito)
    - value: 1
      label: Auto (scuro)
    - value: 2
      label: Schermo spento
    - value: 3
      label: 5 %
    - value: 4
      label: 10 %
    - value: 5
      label: 15 %
    - value: 6
      label: 20 %
    - value: 7
      label: 25 %
    - value: 8
      label: 30 %
    - value: 9
      label: 35 %
    - value: 10
      label: 40 %
    - value: 11
      label: 45 %
    - value: 12
      label: 50 %
    - value: 13
      label: 55 %
    - value: 14
      label: 60 %
    - value: 15
      label: 65 %
    - value: 16
      label: 70 %
    - value: 17
      label: 75 %
    - value: 18
      label: 80 %
    - value: 19
      label: 85 %
    - value: 20
      label: 90 %
    - value: 21
      label: 95 %
    - value: 22
      label: 100 %
  - key: OnroadScreenOffTimer
    widget: multiple_button
    title: Ritardo luminosità durante la guida
    options:
    - value: 0
      label: Sempre acceso
    - value: 3
      label: 3s
    - value: 5
      label: 5s
    - value: 10
      label: 10s
    - value: 15
      label: 15s
    - value: 30
      label: 30s
    - value: 60
      label: 1m
    - value: 180
      label: 3m
    - value: 300
      label: 5m
    - value: 600
      label: 10m
    enablement:
    - type: not
      condition:
        type: any
        conditions:
        - type: param
          key: OnroadScreenOffBrightness
          equals: 0
        - type: param
          key: OnroadScreenOffBrightness
          equals: 1
  - key: InteractivityTimeout
    widget: multiple_button
    title: Timeout interazione
    description: 'Imposta un timeout personalizzato per le impostazioni: è il tempo dopo il quale le impostazioni si chiudono da sole se non tocchi lo schermo.'
    options:
    - value: 0
      label: Predefinito
    - value: 10
      label: 10 s
    - value: 20
      label: 20 s
    - value: 30
      label: 30 s
    - value: 40
      label: 40 s
    - value: 50
      label: 50 s
    - value: 60
      label: 1 m
    - value: 70
      label: 1 m
    - value: 80
      label: 1 m
    - value: 90
      label: 1 m
    - value: 100
      label: 1 m
    - value: 110
      label: 1 m
    - value: 120
      label: 2 m
  - key: HomeShowActiveModel
    widget: toggle
    title: Mostra il modello di guida nella schermata iniziale
    description: Mostra il nome del modello di guida attivo nella schermata iniziale offroad.
  - key: ScreenSaverEnabled
    widget: toggle
    title: Salvaschermo
    description: Mostra un salvaschermo quando il dispositivo è offroad e inattivo, invece di spegnere lo schermo.
  - key: ScreenSaverTimeout
    widget: multiple_button
    title: Durata salvaschermo
    description: Per quanto tempo resta il salvaschermo prima che lo schermo si spenga.
    options:
    - value: 60
      label: 1 m
    - value: 120
      label: 2 m
    - value: 180
      label: 3 m
    - value: 240
      label: 4 m
    - value: 300
      label: 5 m
    - value: 360
      label: 6 m
    - value: 420
      label: 7 m
    - value: 480
      label: 8 m
    - value: 540
      label: 9 m
    - value: 600
      label: 10 m
    enablement:
    - type: param
      key: ScreenSaverEnabled
      equals: true
