# Page: toggles
# Edit this file. Run compile_settings_ui.py to emit settings_ui.json.
id: toggles
label: Opzioni
icon: toggles
order: 5
remote_configurable: true
description: Opzioni principali di openpilot
sections:
- id: core_toggles
  title: ''
  description: ''
  items:
  - key: OpenpilotEnabledToggle
    widget: toggle
    needs_onroad_cycle: true
    title: Attiva sunnypilot
    description: Usa il sistema sunnypilot per il cruise control adattivo e l'assistenza al mantenimento della corsia. Questa funzione richiede sempre la tua attenzione.
    enablement:
    - $ref: '#/macros/offroad'
  - key: IsLdwEnabled
    widget: toggle
    title: Attiva avvisi di uscita dalla corsia
    description: Ricevi un avviso per rientrare in corsia quando il veicolo supera una linea di corsia senza freccia inserita, sopra i 50 km/h (31 mph).
  - key: AlwaysOnDM
    widget: toggle
    title: Monitoraggio conducente sempre attivo
    description: Attiva il monitoraggio del conducente anche quando sunnypilot non è inserito.
  - key: IsMetric
    widget: toggle
    title: Usa il sistema metrico
    description: Mostra la velocità in km/h invece che in mph.
- id: recording
  title: Registrazione
  description: Registrazione video e audio durante la guida
  items:
  - key: RecordFront
    widget: toggle
    needs_onroad_cycle: true
    title: Registra e carica la telecamera del conducente
    description: Carica i dati della telecamera rivolta al conducente e aiuta a migliorare l'algoritmo di monitoraggio del conducente.
  - key: RecordAudio
    widget: toggle
    needs_onroad_cycle: true
    title: Registra e carica l'audio del microfono
    description: Registra e salva l'audio del microfono durante la guida. L'audio sarà incluso nel video dashcam su comma connect.
