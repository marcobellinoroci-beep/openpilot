# Page: visuals
# Edit this file. Run compile_settings_ui.py to emit settings_ui.json.
id: visuals
label: Grafica
icon: visuals
order: 4
remote_configurable: true
description: Elementi HUD, avvisi e indicazioni a schermo
sections:
- id: hud_elements
  title: Elementi HUD
  description: Elementi mostrati sulla schermata di guida
  items:
  - key: BlindSpot
    widget: toggle
    title: Mostra avvisi angolo cieco
    description: Mostra un avviso quando viene rilevato un veicolo nell'angolo cieco, se l'auto supporta il BSM.
  - key: TorqueBar
    widget: toggle
    title: Arco di sterzata
    description: Mostra l'arco di sterzata sulla schermata di guida quando il controllo laterale è attivo.
    visibility:
    - $ref: '#/macros/hide_on_mici'
  - key: ConfidenceBall
    widget: toggle
    title: Indicatore di affidabilità
    description: "Mostra l'affidabilità del modello con una pallina sul tuo lato dello schermo, come sul comma 4: più è in alto, più il modello è sicuro; quando è inserito è verde, poi gialla, poi rossa man mano che l'affidabilità cala."
    visibility:
    - $ref: '#/macros/hide_on_mici'
  - key: ShowTurnSignals
    widget: toggle
    title: Mostra frecce
    description: Se attivo, gli indicatori di direzione vengono mostrati sull'HUD.
    visibility:
    - $ref: '#/macros/hide_on_mici'
  - key: RoadNameToggle
    widget: toggle
    title: Mostra nome della strada
    description: Mostra il nome della strada che stai percorrendo. Per ottenerlo bisogna scaricare il database OpenStreetMap della zona.
    visibility:
    - $ref: '#/macros/hide_on_mici'
  - key: StandstillTimer
    widget: toggle
    title: Timer da fermo
    description: Mostra un timer sull'HUD quando l'auto è ferma.
    visibility:
    - $ref: '#/macros/hide_on_mici'
  - key: RocketFuel
    widget: toggle
    title: Barra accelerazione in tempo reale
    description: Mostra un indicatore sul lato sinistro dello schermo con accelerazione e decelerazione del veicolo in tempo reale. Indica cosa sta facendo l'auto, non cosa richiede il pianificatore.
    visibility:
    - $ref: '#/macros/hide_on_mici'
  - key: ChevronInfo
    widget: option
    title: Mostra dati sotto il chevron
    options:
    - value: 0
      label: 'Off'
    - value: 1
      label: Distanza
    - value: 2
      label: Velocità
    - value: 3
      label: Tempo
    - value: 4
      label: Tutti
    visibility:
    - $ref: '#/macros/hide_on_mici'
    enablement:
    - $ref: '#/macros/longitudinal'
- id: developer_ui
  title: Info interfaccia sviluppatore
  description: Opzioni tachimetro e visualizzazione debug
  visibility:
  - $ref: '#/macros/hide_on_mici'
  items:
  - key: DevUIInfo
    widget: option
    title: Interfaccia sviluppatore
    description: Mostra parametri e dati in tempo reale da varie fonti.
    options:
    - value: 0
      label: 'Off'
    - value: 1
      label: In basso
    - value: 2
      label: A destra
    - value: 3
      label: A destra e in basso
  - key: TrueVEgoUI
    widget: toggle
    title: 'Tachimetro: mostra sempre la velocità reale'
    description: Sui veicoli compatibili, mostra sempre la velocità reale rilevata dai sensori di velocità delle ruote.
  - key: HideVEgoUI
    widget: toggle
    title: 'Tachimetro: nascondi dalla schermata di guida'
    description: Se attivo, il tachimetro non viene mostrato nella schermata di guida.
- id: alerts_extras
  title: Avvisi ed extra
  description: Avvisi semaforo ed effetti grafici
  items:
  - key: GreenLightAlert
    widget: toggle
    title: Avviso semaforo verde (Beta)
    description: 'Un segnale acustico e un avviso a schermo ti avvisano quando il semaforo che stai aspettando diventa verde e non hai veicoli davanti. L''avviso a schermo è disponibile solo su comma 3X. Nota: il segnale acustico è solo una notifica. Spetta al conducente osservare ciò che lo circonda e decidere di conseguenza.'
  - key: LeadDepartAlert
    widget: toggle
    title: Avviso partenza veicolo davanti (Beta)
    description: 'Un segnale acustico e un avviso a schermo ti avvisano quando sei fermo e il veicolo davanti riparte. L''avviso a schermo è disponibile solo su comma 3X. Nota: il segnale acustico è solo una notifica. Spetta al conducente osservare ciò che lo circonda e decidere di conseguenza.'
  - key: RainbowMode
    widget: toggle
    title: Modalità arcobaleno Tesla
    description: Mostra un effetto arcobaleno sul percorso che il modello vuole seguire. Non influisce in alcun modo sulla guida.
