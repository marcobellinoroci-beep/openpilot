# Page: cruise
# Edit this file. Run compile_settings_ui.py to emit settings_ui.json.
id: cruise
label: Cruise
icon: cruise_control
order: 2
remote_configurable: true
description: Controllo longitudinale, limiti di velocità e comportamento del cruise
sections:
- id: alpha_longitudinal
  title: Longitudinale Alpha
  description: ''
  items:
  - key: AlphaLongitudinalEnabled
    widget: toggle
    needs_onroad_cycle: true
    blocked: true
    title: Controllo longitudinale zoompilot (Alpha)
    description: 'ATTENZIONE: il controllo longitudinale di zoompilot è in fase alpha per quest''auto e può disattivare la frenata automatica d''emergenza (AEB). Su quest''auto zoompilot usa di default l''ACC di serie invece del proprio controllo longitudinale. Attiva questa opzione per passare al controllo longitudinale di zoompilot. Modificare questa impostazione riavvia zoompilot se l''auto è accesa.'
    visibility:
    - type: capability
      field: alpha_long_available
      equals: true
    enablement:
    - $ref: '#/macros/not_engaged'
  - key: ExperimentalModeSetSpeed
    widget: toggle
    title: Assistenza velocità impostata
    description: Porta l'auto verso la velocità e la distanza impostate quando il modello di guida resta indietro. Ogni rallentamento resta deciso dal modello. Si attiva o disattiva anche con il pulsante a schermo durante la guida e con una pressione lunga del tasto distanza.
    visibility:
    - $ref: '#/macros/longitudinal'
    enablement:
    - $ref: '#/macros/longitudinal'
  - key: ConfirmStartFromStop
    widget: toggle
    title: Conferma partenza da fermo (Beta)
    description: "Da fermo con zoompilot inserito e il controllo longitudinale di zoompilot attivo (ad esempio al semaforo rosso), l'auto non riparte da sola: aspetta un tocco dell'acceleratore. Quando ripartirebbe (ad esempio con il verde o quando l'auto davanti si muove) suona un solo bip. Si attiva dopo almeno 1 s di fermo; il freno, il disinserimento e la frenata d'emergenza funzionano come sempre."
    visibility:
    - $ref: '#/macros/longitudinal'
    enablement:
    - $ref: '#/macros/longitudinal'
  - key: RoundaboutAssist
    widget: toggle
    title: Avviso rotonda (Beta)
    description: "Con un percorso del navigatore Mapbox attivo, zoompilot inserito e il controllo longitudinale di zoompilot attivo: quando la prossima manovra è una rotatoria entro 150 m suona un solo bip e la velocità viene limitata dolcemente a circa 27 km/h (frenata massima 1 m/s²). Se ti fermi vicino alla rotatoria, l'auto resta ferma finché non tocchi l'acceleratore. L'acceleratore annulla il limite per quella rotatoria. Non guarda a sinistra per te: dare la precedenza resta compito tuo. Senza percorso Mapbox non fa nulla."
    visibility:
    - $ref: '#/macros/longitudinal'
    enablement:
    - $ref: '#/macros/longitudinal'
  - key: StopDistance
    widget: option
    title: Distanza da fermo dietro un'auto
    description: |-
      Distanza a cui zoompilot si ferma dietro un'auto ferma o quasi ferma (semaforo, incrocio, coda). 6 m è il valore originale.
      Non cambia la distanza di sicurezza in marcia: l'effetto sparisce quando l'auto davanti supera circa 20 km/h.
    details: |-
      La distanza è misurata dalla sola telecamera (niente radar): da vicino può sbagliare di circa un metro.
      Il valore è un riferimento del pianificatore, non la distanza esatta tra i paraurti, e il modello di guida può
      fermarsi comunque prima. Riduci a piccoli passi e resta pronto a frenare, soprattutto in salita.
    min: 3.5
    max: 6
    step: 0.5
    unit: meters
    visibility:
    - $ref: '#/macros/longitudinal'
    enablement:
    - $ref: '#/macros/longitudinal'
- id: core_cruise_features
  title: ''
  description: ''
  items:
  - key: DisengageOnAccelerator
    widget: toggle
    title: Disinserisci il cruise con l'acceleratore
    description: Se attivo, premere l'acceleratore disinserisce il controllo longitudinale.
  - key: LongitudinalPersonality
    widget: multiple_button
    title: Stile di guida
    description: Si consiglia Standard. In modalità aggressiva sunnypilot segue più da vicino il veicolo davanti ed è più deciso con acceleratore e freno. In modalità rilassata sunnypilot mantiene una distanza maggiore dal veicolo davanti. Sulle auto supportate puoi passare da uno stile all'altro con il tasto distanza sul volante.
    options:
    - value: 0
      label: Aggressivo
    - value: 1
      label: Standard
    - value: 2
      label: Rilassato
    enablement:
    - $ref: '#/macros/longitudinal'
- id: custom_acc_increments
  title: Incrementi velocità ACC personalizzati
  description: ''
  enablement:
  - type: any
    conditions:
    - type: all
      conditions:
      - type: capability
        field: has_longitudinal_control
        equals: true
      - type: not
        condition:
          type: capability
          field: pcm_cruise
          equals: true
    - type: capability
      field: has_icbm
      equals: true
  items:
  - key: CustomAccIncrementsEnabled
    widget: toggle
    title: Attiva incrementi velocità ACC personalizzati
    enablement:
    - type: any
      conditions:
      - type: all
        conditions:
        - type: capability
          field: has_longitudinal_control
          equals: true
        - type: not
          condition:
            type: capability
            field: pcm_cruise
            equals: true
      - type: capability
        field: has_icbm
        equals: true
    - $ref: '#/macros/icbm_feature_not_engaged'
  sub_panels:
  - id: custom_acc_intervals
    label: Impostazioni incrementi velocità ACC
    trigger_key: CustomAccIncrementsEnabled
    trigger_condition:
      type: param
      key: CustomAccIncrementsEnabled
      equals: true
    items:
    - key: CustomAccShortPressIncrement
      widget: option
      title: Incremento pressione breve
      min: 1
      max: 10
      step: 1
      enablement:
      - type: param
        key: CustomAccIncrementsEnabled
        equals: true
    - key: CustomAccLongPressIncrement
      widget: option
      title: Incremento pressione lunga
      min: 1
      max: 10
      step: 1
      enablement:
      - type: param
        key: CustomAccIncrementsEnabled
        equals: true
- id: speed_limits
  title: Limiti di velocità
  description: Rilevamento dei limiti di velocità e scostamento
  items: []
  sub_panels:
  - id: speed_limit_settings
    label: Impostazioni limiti di velocità
    trigger_key: SpeedLimitMode
    items:
    - key: SpeedLimitMode
      widget: multiple_button
      title: Modalità assistenza limite di velocità
      options:
      - value: 0
        label: 'Off'
      - value: 1
        label: Informazione
      - value: 2
        label: Avviso
      - value: 3
        label: Assistenza
        enablement:
        - type: any
          conditions:
          - type: not_engaged
          - type: param
            key: SpeedLimitMode
            equals: 3
          - type: capability
            field: has_icbm
            equals: false
        - type: any
          conditions:
          - type: capability
            field: has_longitudinal_control
            equals: true
          - type: capability
            field: has_icbm
            equals: true
        - type: not
          condition:
            type: capability
            field: brand
            equals: rivian
        - type: not
          condition:
            type: all
            conditions:
            - type: capability
              field: brand
              equals: tesla
            - type: capability
              field: is_sp_release
              equals: true
    - key: SpeedLimitPolicy
      widget: multiple_button
      title: Fonte del limite di velocità
      description: Auto segue il limite mostrato dall'auto e, quando l'auto non ne mostra, quello della mappa. La mappa rallenta anche l'auto prima di un limite più basso più avanti.
      visibility:
      - type: capability
        field: has_speed_limit
        equals: true
      options:
      - value: 2
        label: Auto
      - value: 0
        label: Solo auto
      - value: 1
        label: Solo mappa
    - key: SpeedLimitOffsetType
      widget: multiple_button
      title: Tipo di scostamento dal limite
      options:
      - value: 0
        label: 'Off'
      - value: 1
        label: Fisso
      - value: 2
        label: Percentuale
    - key: SpeedLimitValueOffset
      widget: option
      title: Valore di scostamento dal limite
      min: -30
      max: 30
      step: 1
      unit:
        metric: km/h
        imperial: mph
      visibility:
      - type: param_compare
        key: SpeedLimitOffsetType
        op: '>'
        value: 0
- id: smart_cruise
  title: Cruise control intelligente
  description: ''
  enablement:
  - type: any
    conditions:
    - type: capability
      field: has_longitudinal_control
      equals: true
    - type: capability
      field: has_icbm
      equals: true
  items:
  - key: SmartCruiseControlVision
    widget: toggle
    title: Visione
    description: Usa le previsioni di traiettoria della telecamera per stimare la velocità adatta alle curve in arrivo.
    visibility:
    - type: any
      conditions:
      - type: capability
        field: has_longitudinal_control
        equals: true
      - type: capability
        field: has_icbm
        equals: true
    enablement:
    - type: any
      conditions:
      - type: capability
        field: has_longitudinal_control
        equals: true
      - type: capability
        field: has_icbm
        equals: true
    - $ref: '#/macros/icbm_scc_not_engaged'
  - key: SmartCruiseControlMap
    widget: toggle
    title: Mappa
    description: Usa i dati della mappa per stimare la velocità adatta alle curve in arrivo.
    visibility:
    - type: any
      conditions:
      - type: capability
        field: has_longitudinal_control
        equals: true
      - type: capability
        field: has_icbm
        equals: true
    enablement:
    - type: any
      conditions:
      - type: capability
        field: has_longitudinal_control
        equals: true
      - type: capability
        field: has_icbm
        equals: true
    - $ref: '#/macros/icbm_scc_not_engaged'
